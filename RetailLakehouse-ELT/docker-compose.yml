name: retail-lakehouse-elt

# =====================================================================================
# RetailLakehouse-ELT  |  PostgreSQL -> MinIO(staging) -> Spark -> Parquet(lake)
#                                   -> Hive Metastore -> dbt -> Trino
# -------------------------------------------------------------------------------------
# Requisitos: Docker Desktop con >= 8 GB de RAM asignados y >= 4 CPUs.
# Arranque:   docker compose up --build -d     (primera vez tarda 5-10 min)
# =====================================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "180"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__WEBSERVER__RBAC: "True"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
    PYTHONPATH: /opt/airflow
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    SPARK_CONF_DIR: /opt/spark-conf
    PYSPARK_PYTHON: /usr/local/bin/python
    # -------------------------------------------------------------------
    # Conexiones / credenciales consumidas por los scripts del pipeline
    # -------------------------------------------------------------------
    PG_HOST: postgres-source
    PG_PORT: "5432"
    PG_DATABASE: ${PG_DATABASE:-olist}
    PG_USER: ${PG_USER:-olist}
    PG_PASSWORD: ${PG_PASSWORD:-olist}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    MINIO_STAGING_BUCKET: staging
    MINIO_LAKE_BUCKET: lake
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    TRINO_HOST: trino
    TRINO_PORT: "8080"
    TRINO_USER: dbt
    # Conexion Spark (usada por SparkSubmitOperator). El hook construye
    # --master como host:port, asi que el esquema va DENTRO del host;
    # 'spark://spark-master:7077' plano pierde el esquema y Spark falla con
    # "Could not parse Master URL". JSON es la forma soportada por Airflow.
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    # Conexion Postgres (catalogo de Airflow / usada por extract)
    AIRFLOW_CONN_POSTGRES_SOURCE: postgresql+psycopg2://${PG_USER:-olist}:${PG_PASSWORD:-olist}@postgres-source:5432/${PG_DATABASE:-olist}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./extract:/opt/airflow/extract
    - ./spark:/opt/airflow/spark
    - ./dbt:/opt/airflow/dbt
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./config/spark:/opt/spark-conf:ro
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres-meta:
      condition: service_healthy
    minio:
      condition: service_healthy

services:

  # -----------------------------------------------------------------------------
  # 1. FUENTE: base relacional de ventas (esquema tipo OLIST)
  # -----------------------------------------------------------------------------
  postgres-source:
    image: postgres:15
    container_name: rl-postgres-source
    environment:
      POSTGRES_DB: ${PG_DATABASE:-olist}
      POSTGRES_USER: ${PG_USER:-olist}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-olist}
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-olist} -d ${PG_DATABASE:-olist}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------------------
  # Base compartida para el Hive Metastore y la metadata de Airflow
  # (en un entorno real serian instancias separadas; aqui se agrupan por RAM)
  # -----------------------------------------------------------------------------
  postgres-meta:
    image: postgres:15
    container_name: rl-postgres-meta
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - ./scripts/init_meta_databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------------------
  # 3. ALMACENAMIENTO DE OBJETOS (S3 compatible)
  # -----------------------------------------------------------------------------
  minio:
    # Imagen fijada a una release concreta (reproducibilidad). MinIO purga los tags
    # antiguos de Docker Hub: si en el futuro este tag desaparece, sustituyelo por
    # otro de https://hub.docker.com/r/minio/minio/tags
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rl-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web  (minioadmin / minioadmin)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Crea los buckets staging/ y lake/ la primera vez
  minio-init:
    # Mismo aviso que arriba: https://hub.docker.com/r/minio/mc/tags
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: rl-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "set -e;
       until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio...'; sleep 2; done;
       mc mb --ignore-existing local/staging;
       mc mb --ignore-existing local/lake;
       mc anonymous set none local/staging;
       mc anonymous set none local/lake;
       echo 'Buckets listos:'; mc ls local/"
    depends_on:
      minio:
        condition: service_healthy

  # -----------------------------------------------------------------------------
  # 5. CATALOGO: Hive Metastore (Thrift) respaldado por PostgreSQL
  # -----------------------------------------------------------------------------
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: rl-hive-metastore
    user: root
    depends_on:
      postgres-meta:
        condition: service_healthy
    environment:
      HIVE_CONF_DIR: /opt/hive/conf
      SERVICE_NAME: metastore
    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/hive/lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rm -f /opt/hive/lib/postgresql-9.4.1208.jre7.jar
        # S3A en el classpath de Hive (la imagen los trae en /opt/hadoop):
        # sin esto, CREATE SCHEMA/TABLE con location s3:// falla con
        # "No FileSystem for scheme" / ClassNotFoundException.
        cp -n /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.1.0.jar /opt/hive/lib/ || true
        cp -n /opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.271.jar /opt/hive/lib/ || true
        /opt/hive/bin/schematool -dbType postgres -info || /opt/hive/bin/schematool -dbType postgres -initSchema
        exec /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"

  # -----------------------------------------------------------------------------
  # 4. PROCESAMIENTO: Apache Spark Standalone (master + worker)
  # -----------------------------------------------------------------------------
  spark-master:
    image: spark:3.5.1-scala2.12-java17-python3-ubuntu
    container_name: rl-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark:/opt/spark/work-dir/jobs:ro
      - spark-ivy:/root/.ivy2
    ports:
      - "8083:8080"
      - "7077:7077"
    depends_on:
      minio:
        condition: service_healthy

  spark-worker:
    image: spark:3.5.1-scala2.12-java17-python3-ubuntu
    container_name: rl-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark:/opt/spark/work-dir/jobs:ro
      - spark-ivy:/root/.ivy2
    ports:
      - "8084:8081"
    depends_on:
      - spark-master

  # -----------------------------------------------------------------------------
  # 6. MOTOR DE CONSULTAS: Trino
  # -----------------------------------------------------------------------------
  trino:
    image: trinodb/trino:442
    container_name: rl-trino
    ports:
      - "8082:8080"
    volumes:
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/node.properties:/etc/trino/node.properties:ro
      - ./config/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "trino --server localhost:8080 --execute 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20

  # Crea los esquemas del lakehouse apuntando a MinIO y registra las tablas
  # externas que apuntan al Parquet escrito por Spark.
  trino-init:
    image: trinodb/trino:442
    container_name: rl-trino-init
    volumes:
      - ./scripts/init_trino_schemas.sql:/tmp/init_trino_schemas.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "set -e;
       until trino --server trino:8080 --execute 'SELECT 1' >/dev/null 2>&1; do echo 'waiting for trino...'; sleep 5; done;
       trino --server trino:8080 --debug -f /tmp/init_trino_schemas.sql;
       echo 'Esquemas y tablas externas registradas en el Hive Metastore.'"
    depends_on:
      trino:
        condition: service_healthy

  # -----------------------------------------------------------------------------
  # 2. ORQUESTACION: Apache Airflow
  # -----------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: rl-airflow-init
    entrypoint: ["/bin/bash", "-c"]
    # Lista + bloque literal: evita el plegado de YAML y $$ escapa la
    # interpolacion de Compose para que bash aplique los valores por defecto.
    command:
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Data --lastname Engineer \
          --role Admin \
          --email airflow@example.com || true
        echo 'Airflow inicializado.'
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: rl-airflow-webserver
    command: airflow webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: rl-airflow-scheduler
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      trino-init:
        condition: service_completed_successfully

  # -----------------------------------------------------------------------------
  # 7. DOCUMENTACION dbt: sirve el sitio estatico generado por `dbt docs generate`
  #    -> http://localhost:8080
  # -----------------------------------------------------------------------------
  dbt-docs:
    image: python:3.11-slim
    container_name: rl-dbt-docs
    working_dir: /site
    command: python -m http.server 8080 --bind 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./dbt/target:/site:ro

  # -----------------------------------------------------------------------------
  # Herramientas auxiliares (no arrancan con `docker compose up`)
  # -----------------------------------------------------------------------------
  seed-postgres:
    <<: *airflow-common
    container_name: rl-seed-postgres
    profiles: ["tools"]
    entrypoint: ["/bin/bash", "-c"]
    command: python /opt/airflow/scripts/seed_postgres.py --data-dir /opt/airflow/data/raw
    depends_on:
      postgres-source:
        condition: service_healthy

volumes:
  postgres-source-data:
  postgres-meta-data:
  minio-data:
  spark-ivy:
