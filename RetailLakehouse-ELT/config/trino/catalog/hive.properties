# Catalogo "hive": lee/escribe Parquet en MinIO y usa el Hive Metastore como catalogo
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

# Object store S3 compatible (MinIO)
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

# Formato columnar por defecto de las tablas que crea dbt
hive.storage-format=PARQUET
hive.compression-codec=SNAPPY

# Permisos necesarios para el flujo de tablas externas / particiones
# (hive.allow-drop-table se elimino: Trino >=442 lo permite por defecto y
# rechaza arrancar si la propiedad existe)
hive.non-managed-table-writes-enabled=true
hive.allow-register-partition-procedure=true
# NOTA: no usar hive.insert-existing-partitions-behavior=OVERWRITE: convierte
# los INSERT en overwrite y Trino no soporta overwrite en tablas NO
# particionadas (rompe `dbt seed`). dbt usa DROP+CREATE y Spark escribe
# Parquet directo, asi que nadie necesita ese modo.
