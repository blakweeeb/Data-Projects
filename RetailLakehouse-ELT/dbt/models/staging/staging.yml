version: 2

models:
  - name: stg_orders
    description: Cabecera de pedidos tipada y normalizada (1 fila por pedido).
    columns:
      - name: order_id
        description: PK del pedido.
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced',
                       'processing', 'created', 'approved']
      - name: order_purchase_timestamp
        tests: [not_null]
      - name: delivery_days
        description: Dias entre la compra y la entrega al cliente.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: stg_order_items
    description: Lineas de pedido con precios y fletes saneados.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: freight_value
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_order_payments
    description: Pagos por pedido (un pedido puede tener varias formas de pago).
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_order_reviews
    description: Reseñas de clientes.
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        # accepted_values cita los literales como strings y Trino no hace
        # coercion implicita en IN (integer vs varchar): se usa rango 1-5.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5

  - name: stg_customers
    description: Maestro de clientes normalizado.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_state
        tests:
          - not_null

  - name: stg_products
    description: Maestro de productos con categoria traducida al ingles.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_category_name_english
        tests: [not_null]

  - name: stg_sellers
    description: Maestro de vendedores.
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_geolocation
    description: Centroide geografico por codigo postal.
    columns:
      - name: geolocation_zip_code_prefix
        tests: [unique, not_null]
