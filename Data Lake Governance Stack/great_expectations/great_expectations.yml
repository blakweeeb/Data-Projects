# Great Expectations Configuration
# Generated by gx init --config-dir great_expectations

config_version: 3.0
datasources:
  raw_filesystem:
    class_name: Datasource
    execution_engine:
      class_name: PandasExecutionEngine
    data_connectors:
      raw_inferred:
        class_name: InferredAssetFilesystemDataConnector
        base_directory: ../data_lake/01_raw
        default_regex:
          pattern: (.*)/year=(\d{4})/month=(\d{2})/(.*)\.parquet
          group_names: [entity, year, month, filename]
        glob_directive: "**/*.parquet"

  curated_filesystem:
    class_name: Datasource
    execution_engine:
      class_name: PandasExecutionEngine
    data_connectors:
      curated_inferred:
        class_name: InferredAssetFilesystemDataConnector
        base_directory: ../data_lake/02_curated
        default_regex:
          pattern: (.*)\.parquet
          group_names: [entity]
        glob_directive: "*.parquet"

expectations_store:
  class_name: ExpectationsStore
  store_backend:
    class_name: TupleFilesystemStoreBackend
    base_directory: expectations

validations_store:
  class_name: ValidationsStore
  store_backend:
    class_name: TupleFilesystemStoreBackend
    base_directory: validations

evaluation_parameter_store:
  class_name: EvaluationParameterStore

checkpoint_store:
  class_name: CheckpointStore
  store_backend:
    class_name: TupleFilesystemStoreBackend
    base_directory: checkpoints

data_docs_sites:
  local_site:
    class_name: SiteBuilder
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: uncommitted/data_docs/local_site
    site_index_builder:
      class_name: DefaultSiteIndexBuilder

anonymous_usage_statistics:
  enabled: false